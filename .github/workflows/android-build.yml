name: Build Android APK

on:
  push:
    branches: [main, map-progression-redesign, illustrated-world-map, world-globe-country-journey]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euxo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          "$SDKMANAGER" --list_installed

      - name: Download Godot 4.4.1 and export templates
        run: |
          GODOT_VERSION="4.4.1"
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -O "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          wget -q "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz" -O "$HOME/godot/templates.tpz"
          mkdir -p "$HOME/godot/templates"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          test -d "$HOME/godot/templates/templates"
          cp -v "$HOME/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"
          chmod +x "$HOME/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          "$HOME/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" --version
          ls -lah "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Build high-resolution satellite Earth texture with precise country borders
        run: |
          set -euxo pipefail
          mkdir -p assets
          python3 -m venv /tmp/globe-venv
          /tmp/globe-venv/bin/pip install pillow
          curl -fL --retry 3 --retry-delay 2 \
            "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography/january/world.topo.200401.3x21600x10800.jpg" \
            -o /tmp/earth_base.jpg
          /tmp/globe-venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw, ImageOps
          import json
          # NASA's source is 21600x10800; allow this trusted image before downsampling.
          Image.MAX_IMAGE_PIXELS = None
          image = Image.open("/tmp/earth_base.jpg").convert("RGB")
          # Keep a high-detail global texture while staying below common mobile GPU texture limits.
          image.thumbnail((10800, 5400), Image.Resampling.LANCZOS)
          width, height = image.size
          with open("data/countries_world.json", encoding="utf-8") as f:
              world = json.load(f)
          land_mask = Image.new("L", (width, height), 0)
          mask_draw = ImageDraw.Draw(land_mask)
          def xy(point):
              lon, lat = float(point[0]), float(point[1])
              return ((lon + 180.0) / 360.0 * (width - 1),
                      (90.0 - lat) / 180.0 * (height - 1))
          valid_rings = []
          for feature in world.get("features", []):
              for polygon in feature.get("g", []):
                  if not polygon:
                      continue
                  outer = polygon[0]
                  crosses_seam = any(abs(float(b[0]) - float(a[0])) > 180.0
                                     for a, b in zip(outer, outer[1:]))
                  if len(outer) >= 3 and not crosses_seam:
                      mask_draw.polygon([xy(p) for p in outer], fill=255)
                  for hole in polygon[1:]:
                      if len(hole) >= 3:
                          mask_draw.polygon([xy(p) for p in hole], fill=0)
                  for ring in polygon:
                      if len(ring) >= 2:
                          valid_rings.append(ring)
          # Give the dark ocean pixels a deep, natural blue while preserving
          # the NASA surface shading and keeping land colors untouched.
          ocean_luma = image.convert("L").point(lambda p: min(255, int(p * 3.2) + 8))
          ocean_blue = ImageOps.colorize(ocean_luma, black="#041a36", white="#197eaa")
          image = Image.composite(image, ocean_blue, land_mask)
          draw = ImageDraw.Draw(image)
          for ring in valid_rings:
              for a, b in zip(ring, ring[1:]):
                  p1, p2 = xy(a), xy(b)
                  if abs(p2[0] - p1[0]) > width * 0.5:
                      continue
                  draw.line((p1, p2), fill=(16, 42, 59), width=5)
                  draw.line((p1, p2), fill=(190, 225, 232), width=3)
          image.save("assets/earth_surface.jpg", "JPEG", quality=94, optimize=True)
          print(f"Created satellite globe texture: {width}x{height}")
          PY
          test -s assets/earth_surface.jpg

      - name: Build expanded offline North Africa satellite detail mosaic
        run: |
          set -euxo pipefail
          /tmp/globe-venv/bin/python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.request import Request, urlopen
          from PIL import Image
          from io import BytesIO
          import math, os
          # Allow the intentionally large regional tile mosaic.
          Image.MAX_IMAGE_PIXELS = None
          os.makedirs("assets", exist_ok=True)

          # Geographic coverage: northern Algeria, Tunisia and nearby coast.
          lon_min, lon_max = -9.0, 16.0
          lat_min, lat_max = 18.0, 38.0
          zoom = 8
          tiles_x = 2 ** zoom * 2
          tiles_y = 2 ** zoom
          x0 = int(math.floor((lon_min + 180.0) / 360.0 * tiles_x))
          x1 = int(math.floor((lon_max + 180.0) / 360.0 * tiles_x))
          y0 = int(math.floor((90.0 - lat_max) / 180.0 * tiles_y))
          y1 = int(math.floor((90.0 - lat_min) / 180.0 * tiles_y))
          base = f"https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/250m/{zoom}"

          def fetch(tile):
              x, y = tile
              url = f"{base}/{y}/{x}.jpg"
              try:
                  req = Request(url, headers={"User-Agent": "ChallengeGeniusOfflineMap/1.0"})
                  with urlopen(req, timeout=35) as response:
                      data = response.read()
                  image = Image.open(BytesIO(data)).convert("RGB")
                  if image.size != (512, 512):
                      raise ValueError(f"Unexpected tile size {image.size}")
                  return (x, y, image)
              except Exception as exc:
                  print(f"Tile {x}/{y} unavailable: {exc}")
                  return (x, y, None)

          tile_ids = [(x, y) for y in range(y0, y1 + 1) for x in range(x0, x1 + 1)]
          mosaic = Image.new("RGB", (len(range(x0, x1 + 1))*512, len(range(y0, y1 + 1))*512), (12, 28, 45))
          success = 0
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(fetch, tile) for tile in tile_ids]
              for future in as_completed(futures):
                  x, y, tile_image = future.result()
                  if tile_image is not None:
                      mosaic.paste(tile_image, ((x-x0)*512, (y-y0)*512))
                      success += 1

          if success < int(len(tile_ids) * 0.70):
              raise SystemExit(f"Only {success}/{len(tile_ids)} NASA detail tiles downloaded")

          px_per_degree_x = tiles_x * 512 / 360.0
          px_per_degree_y = tiles_y * 512 / 180.0
          left = round((lon_min + 180.0) * px_per_degree_x - x0 * 512)
          right = round((lon_max + 180.0) * px_per_degree_x - x0 * 512)
          top = round((90.0 - lat_max) * px_per_degree_y - y0 * 512)
          bottom = round((90.0 - lat_min) * px_per_degree_y - y0 * 512)
          detail = mosaic.crop((left, top, right, bottom))
          detail.thumbnail((8192, 8192), Image.Resampling.LANCZOS)
          detail.save("assets/north_africa_detail.jpg", "JPEG", quality=91, optimize=True)
          print(f"Created offline regional imagery {detail.size}; {success}/{len(tile_ids)} tiles")
          PY
          test -s assets/north_africa_detail.jpg

      - name: Import project
        run: |
          set -euxo pipefail
          "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --editor --path . --import
          "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run game startup smoke test
        run: |
          set -euxo pipefail
          GODOT="$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
          timeout 30 "$GODOT" --headless --path . --quit-after 5 2>&1 | tee startup-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" startup-smoke.log; then
            echo "Godot startup smoke test detected a script error."
            exit 1
          fi

      - name: Run world globe runtime smoke test
        run: |
          set -euxo pipefail
          GODOT="$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
          timeout 60 "$GODOT" --headless --path . --script res://scripts/globe_smoke_test.gd --quit-after 5 2>&1 | tee globe-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" globe-smoke.log; then
            echo "World globe runtime smoke test detected an error."
            exit 1
          fi
          grep "WORLD_GLOBE_SMOKE_OK" globe-smoke.log

      - name: Create Android debug keystore
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Diagnose Android export preset
        run: |
          set -u
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          GODOT="$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          "$GODOT" --headless --verbose --path . --export-debug "Android" build/Diagnostic.apk > godot-export-diagnostic.log 2>&1
          RESULT=$?
          set -e
          echo "Godot diagnostic export exit code: $RESULT"
          grep -inE "error|warning|invalid|missing|cannot|not found|export" godot-export-diagnostic.log | tail -n 160 || true
          echo "----- Full diagnostic log tail -----"
          tail -n 240 godot-export-diagnostic.log
          exit 0

      - name: Export debug APK
        run: |
          set -euxo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build
          "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --verbose --path . --export-debug "Android" build/Challenge.apk
          test -s build/Challenge.apk
          ls -lh build/Challenge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: challenge-android-apk
          path: build/Challenge.apk
          if-no-files-found: error
          retention-days: 14
