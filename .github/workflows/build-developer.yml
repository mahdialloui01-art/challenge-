name: Build Developer Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - developer-edition
    paths:
      - "scripts/**"
      - "scenes/**"
      - "data/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-developer.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout developer edition
        uses: actions/checkout@v4

      - name: Prepare Godot Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          cp -a /root/.config/godot/editor_settings-4.4.tres "$HOME/.config/godot/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          java -version
          test -d /usr/lib/android-sdk
          echo "Godot Android templates and SDK settings are ready."

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export developer APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Developer Android" build/Challenge_Developer.apk
          test -s build/Challenge_Developer.apk

      - name: Upload developer APK
        uses: actions/upload-artifact@v4
        with:
          name: challenge-developer-android-apk
          path: build/Challenge_Developer.apk
          if-no-files-found: error
          retention-days: 14
